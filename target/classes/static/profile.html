<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - 极客聊天室</title>
    <link rel="stylesheet" href="profile.css">
</head>
<body>
    <div class="profile-container">
        <div class="profile-header">
            <h1>个人主页</h1>
            <a href="chat.html" class="back-btn">返回聊天室</a>
        </div>

        <div class="profile-body">
            <!-- 头像区域 -->
            <div class="avatar-section">
                <img id="preview-avatar" src="" alt="头像">
                <label for="avatar-upload" class="upload-btn">更换头像</label>
                <input type="file" id="avatar-upload" accept="image/*" hidden>
            </div>

            <!-- 资料编辑表单 -->
            <div class="form-section">
                <div class="form-item">
                    <label>用户名（不可修改）</label>
                    <input type="text" id="username" disabled>
                </div>
                <div class="form-item">
                    <label>昵称</label>
                    <input type="text" id="nickname" placeholder="请输入昵称" maxlength="20">
                </div>
                <div class="form-item">
                    <label>个性签名</label>
                    <textarea id="signature" placeholder="这个人很懒，什么都没留下..." maxlength="200"></textarea>
                </div>
                <div class="form-item">
                    <label>性别</label>
                    <div class="gender-group">
                        <label><input type="radio" name="gender" value="0"> 保密</label>
                        <label><input type="radio" name="gender" value="1"> 男</label>
                        <label><input type="radio" name="gender" value="2"> 女</label>
                    </div>
                </div>
                <div class="form-item">
                    <label>邮箱</label>
                    <input type="email" id="email" placeholder="请输入邮箱">
                </div>
                <button class="save-btn" id="save-btn">保存修改</button>
            </div>
        </div>
    </div>
    <script src="profile.js"></script>
</body>
</html>
